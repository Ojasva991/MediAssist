# Pings the API every 10 minutes so Render's free instance doesn't spin
# down (it sleeps after 15 idle minutes), and touches the database so
# Neon stays warm. Set the repo variable API_URL (Settings > Variables).
name: Keep API awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --max-time 60 "${{ vars.API_URL }}/health"
